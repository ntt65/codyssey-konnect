name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Check generated pip files
        run: uv run --locked python utils/scripts/sync_requirements.py --check
      - name: Check keyless configuration
        run: uv run --locked python utils/scripts/setup_dev.py --feature basic
      - name: Offline application smoke
        run: uv run --locked python utils/scripts/verify_dev.py
      - name: Backend regression tests
        run: uv run --locked python -m pytest -q
      - name: Frontend transport tests
        run: node --test tests/frontend/http.test.mjs
      - name: Frontend syntax
        run: |
          node --check frontend/js/http.js
          node --check frontend/js/api.js
          node --check frontend/js/rag.js
